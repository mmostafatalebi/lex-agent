[project]
name = "lexagent"
version = "0.1.0"
description = "A contract review agent for freelancers and small businesses."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "aws-lambda-powertools>=3.0",
    "boto3>=1.34",
    "botocore>=1.34",
    "deepeval>=2.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "ragas>=0.2",
    "reportlab>=4.0",
    "sqlalchemy>=2.0",
    "tenacity>=8.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.4",
    "pytest-mock>=3.12",
    "pytest-postgresql>=5.0",
    "types-pyyaml>=6.0",
    "moto>=5.0",
]
infra = [
    "aws-cdk-cli>=2.140",
    "aws-cdk-lib>=2.140",
    "constructs>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lexagent"]

[tool.mypy]
strict = true
# Analysis target matches the pinned interpreter; transitively installed stubs
# (numpy via pgvector) require a 3.12 target to parse. Source stays 3.11-compatible.
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pgvector.*"]
ignore_missing_imports = true

# aws-cdk-lib and its runtime do not ship py.typed.
[[tool.mypy.overrides]]
module = ["aws_cdk.*", "constructs.*", "jsii.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live external services (skipped by default)",
]
addopts = "--cov=lexagent --cov-report=term-missing -m 'not integration'"
