services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lexagent-db
    environment:
      POSTGRES_USER: lexagent
      POSTGRES_PASSWORD: lexagent
      POSTGRES_DB: lexagent
    ports:
      - "5432:5432"
    volumes:
      - lexagent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexagent -d lexagent"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  lexagent-pgdata:
